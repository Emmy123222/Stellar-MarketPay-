apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "marketpay.fullname" . }}-backend-{{ .Values.blueGreen.activeColor }}
  labels:
    app: backend
    blue-green: {{ .Values.blueGreen.activeColor }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: backend
      blue-green: {{ .Values.blueGreen.activeColor }}
  template:
    metadata:
      labels:
        app: backend
        blue-green: {{ .Values.blueGreen.activeColor }}
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          env:
            - name: STELLAR_NETWORK
              value: {{ .Values.backend.env.STELLAR_NETWORK | quote }}
            - name: HORIZON_URL
              value: {{ .Values.backend.env.HORIZON_URL | quote }}
            - name: REDIS_URL
              value: "redis://{{ include "marketpay.fullname" . }}-redis:6379"
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.healthCheck.path }}
              port: {{ .Values.backend.healthCheck.port }}
            initialDelaySeconds: {{ .Values.backend.healthCheck.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.healthCheck.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.healthCheck.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.healthCheck.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.healthCheck.path }}
              port: {{ .Values.backend.healthCheck.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "marketpay.fullname" . }}-backend-{{ .Values.blueGreen.activeColor }}
  labels:
    app: backend
    blue-green: {{ .Values.blueGreen.activeColor }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: backend
    blue-green: {{ .Values.blueGreen.activeColor }}
