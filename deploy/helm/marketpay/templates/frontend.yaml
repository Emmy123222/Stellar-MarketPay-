apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "marketpay.fullname" . }}-frontend-{{ .Values.blueGreen.activeColor }}
  labels:
    app: frontend
    blue-green: {{ .Values.blueGreen.activeColor }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: frontend
      blue-green: {{ .Values.blueGreen.activeColor }}
  template:
    metadata:
      labels:
        app: frontend
        blue-green: {{ .Values.blueGreen.activeColor }}
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "marketpay.fullname" . }}-frontend-{{ .Values.blueGreen.activeColor }}
  labels:
    app: frontend
    blue-green: {{ .Values.blueGreen.activeColor }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: frontend
    blue-green: {{ .Values.blueGreen.activeColor }}
