# docker-compose.loadtest.yml
#
# Self-contained, production-like stack used for end-to-end load testing
# and SLA benchmarking. Detailed guide: docs/load-testing.md
#
# Complete workflow:
#   1. Spin up stack:
#      docker compose -f docker-compose.loadtest.yml up -d --build
#
#   2. Seed database (phase 1: schema + base records):
#      DATABASE_URL=postgresql://stellarwork:stellarwork_dev@localhost:5432/stellarwork npm run seed-db
#
#   3. Seed synthetic volume (phase 2: writes k6/test-fixtures.json):
#      JWT_SECRET=loadtest-jwt-secret-with-sufficient-length-for-signing \
#      K6_BASE_URL=http://localhost:4000 \
#        node k6/seed-data.js
#
#   4. Run scenarios using the bundled k6 service:
#      docker compose -f docker-compose.loadtest.yml run --rm k6 run get-jobs.js
#      docker compose -f docker-compose.loadtest.yml run --rm k6 run get-profiles.js
#      docker compose -f docker-compose.loadtest.yml run --rm k6 run post-applications.js
#      docker compose -f docker-compose.loadtest.yml run --rm k6 run scripts/authenticated-flow.js
#      docker compose -f docker-compose.loadtest.yml run --rm k6 run scripts/create-escrow.js
#
#   5. Compare against baseline & generate trend report:
#      node k6/lib/trend-report.js --current k6/results --previous k6/previous-results
#
#   6. Generate infrastructure cost & right-sizing report:
#      ./scripts/infrastructure-cost-report.sh
#
#   7. Clean up stack:
#      docker compose -f docker-compose.loadtest.yml down -v
#
# Notable tuning vs. docker-compose.yml:
#   • RATE_LIMIT_SCALE=1000 — relaxes per-IP rate limits so synthetic load is
#     not throttled (production keeps strict limits; default scale = 1).
#   • DB_POOL_MAX=50         — wider PG pool so 100 concurrent VUs do not queue.
#   • ALLOWED_ORIGINS=*      — the k6 runner is not a browser origin.
#   • tmpfs PostgreSQL data  — runs in memory for maximum I/O throughput and zero leftover state.
#   • backend runs `node src/server.js` (production start) with NODE_ENV=development
#     to disable TLS certificate requirements against local containerized Postgres.
#   • k6 runner service      — bundled Grafana k6 image with ./k6 mounted at /work.

version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stellarwork
      POSTGRES_PASSWORD: stellarwork_dev
      POSTGRES_DB: stellarwork
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stellarwork -d stellarwork"]
      interval: 5s
      timeout: 5s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: "4000"
      # NOTE: deliberately NOT "production" — the pg pool enforces SSL
      # (rejectUnauthorized) only when NODE_ENV === "production", and the
      # load-test Postgres container has no TLS configured.
      NODE_ENV: development
      DATABASE_URL: postgresql://stellarwork:stellarwork_dev@postgres:5432/stellarwork
      REDIS_URL: redis://redis:6379
      JWT_SECRET: loadtest-jwt-secret-with-sufficient-length-for-signing
      STELLAR_NETWORK: testnet
      HORIZON_URL: https://horizon-testnet.stellar.org
      ALLOWED_ORIGINS: "*"
      BASE_URL: http://localhost:4000
      # ── load-test tuning (see header comment) ──
      RATE_LIMIT_SCALE: "1000"
      DB_POOL_MAX: "50"
    command: ["node", "src/server.js"]

  k6:
    image: grafana/k6:latest
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./k6:/work
    working_dir: /work
    environment:
      K6_BASE_URL: http://backend:4000
      JWT_SECRET: loadtest-jwt-secret-with-sufficient-length-for-signing
