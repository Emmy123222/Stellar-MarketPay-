# ZAP False Positives / Ignore rules
# Format: <rule-id>\t<url>\t<regex>

# 10020 - Anti-CSRF Tokens Check
# We use JWT tokens in the Authorization header for API endpoints rather than session cookies.
# Therefore, standard anti-CSRF tokens are not strictly necessary for stateless API calls.
# Ignoring for all /api/* routes.
10020	.*\*/api/.*	

# 10038 - Content Security Policy (CSP) Header Not Set
# It's an API server primarily returning JSON, not HTML, so CSP isn't strictly necessary for endpoints.
10038	.*\*/api/.*	

# 10021 - X-Content-Type-Options Header Missing
# Can be ignored on 404/error routes if they don't return HTML, but we'll ignore it broadly for APIs here.
10021	.*\*/api/.*	
