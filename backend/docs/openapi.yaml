openapi: "3.0.0"
info:
  title: Stellar MarketPay API
  version: "1.0.0"
  description: "Backend API for Stellar MarketPay - A decentralized freelance marketplace built on the Stellar blockchain.

## Authentication
Most endpoints require JWT authentication obtained via the **/api/auth** challenge-response flow using Stellar wallet signatures.

## Pagination
List endpoints support cursor-based pagination via the `after` query parameter. Responses include `next_cursor` and `has_more` fields."
  contact:
    name: Stellar MarketPay Team
    email: support@stellarmarketpay.com
  license:
    name: MIT
    url: "https://opensource.org/licenses/MIT"
servers:
  - url: "http://localhost:4000"
    description: Development server
  - url: "https://api.stellarmarketpay.com"
    description: Production server
tags:
  - name: Health
    description: Health check and monitoring endpoints
  - name: Authentication
    description: Stellar wallet-based authentication
  - name: Jobs
    description: Job listing CRUD and management
  - name: Applications
    description: Job application submission and management
  - name: Profiles
    description: User profile management
  - name: Onboarding
    description: User onboarding progress tracking
  - name: Escrow
    description: Escrow management (release, refund, milestones)
  - name: Ratings
    description: User rating and review system
  - name: Progress
    description: Job progress tracking
  - name: Messages
    description: In-app messaging between users
  - name: Insights
    description: Platform analytics and insights
  - name: Notifications
    description: Push/in-app notification management
  - name: WebAuthn
    description: Passkey/WebAuthn authentication
  - name: Disputes
    description: Dispute evidence and resolution
  - name: Admin
    description: Admin-only moderation and analytics
  - name: Admin 2FA
    description: Admin two-factor authentication
  - name: Developer
    description: API key management for developers
  - name: Public API
    description: Public API endpoints (requires API key)
  - name: Time Entries
    description: Time tracking and invoicing
  - name: Referrals
    description: Referral program management
  - name: Events
    description: Contract event indexing
  - name: Invitations
    description: Job invitation system
  - name: Stats
    description: Platform statistics
  - name: Gas
    description: Soroban gas fee estimation
  - name: Transactions
    description: Transaction history export
  - name: DAO
    description: DAO governance (proposals, voting, treasury)
  - name: Proposal Templates
    description: Proposal template management
  - name: Tokens
    description: Stellar token registry and metadata
  - name: Categories
    description: Job category tree
  - name: Skills
    description: Skill autocomplete
  - name: Faucet
    description: Testnet XLM faucet
  - name: "2FA"
    description: Two-factor authentication (TOTP)
  - name: Audit
    description: Audit log access
  - name: Scope
    description: Collaborative scope session management
  - name: Utility
    description: Utility endpoints (rate limit, CSRF)
  - name: Verification
    description: Email, phone, and ID verification
  - name: Contributors
    description: GitHub contributor fetching
  - name: Saved Searches
    description: Saved job search alerts
  - name: Assessments
    description: Skill assessments and certificates
  - name: AI Scorer
    description: AI-powered job description scoring
  - name: NFT
    description: NFT minting for job completion certificates
  - name: Certificates
    description: Skill certificates
  - name: Turrets
    description: Stellar Turrets for serverless contract execution
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /api/auth (Stellar wallet signature)
    cookieAuth:
      type: apiKey
      in: cookie
      name: jwt
      description: JWT cookie set after authentication
    apiKeyHeader:
      type: apiKey
      in: header
      name: x-api-key
      description: Developer API key for public API endpoints
  schemas:
    Error:
      type: object
      description: Structured API error response
      properties:
        error:
          type: object
          required: ['code', 'message']
          properties:
            code:
              type: string
              description: Machine-readable error code
              example: JOB_NOT_FOUND
            message:
              type: string
              description: Human-readable error message
              example: Job not found
            details:
              description: Optional additional context
              nullable: true
    Job:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Job ID
        title:
          type: string
          description: Job title
        description:
          type: string
          description: Job description
        budget:
          type: number
          description: Job budget in XLM
        clientAddress:
          type: string
          description: Client Stellar address
        freelancerAddress:
          type: string
          description: Assigned freelancer address
          nullable: true
        status:
          type: string
          enum: ['open', 'in_progress', 'completed', 'cancelled', 'expired', 'disputed']
          description: Job status
        category:
          type: string
          description: Job category
        skills:
          type: array
          items:
            type: string
          description: Required skills
        currency:
          type: string
          description: Payment currency
          default: XLM
        visibility:
          type: string
          enum: ['public', 'private']
          default: public
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    Application:
      type: object
      properties:
        id:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        freelancerAddress:
          type: string
        proposal:
          type: string
        bidAmount:
          type: number
        estimatedDuration:
          type: string
        status:
          type: string
          enum: ['pending', 'accepted', 'rejected', 'withdrawn']
        createdAt:
          type: string
          format: date-time
    Profile:
      type: object
      properties:
        publicKey:
          type: string
          description: Stellar public key
        displayName:
          type: string
          description: Display name
        bio:
          type: string
          description: User biography
        role:
          type: string
          enum: ['freelancer', 'client', 'both']
        skills:
          type: array
          items:
            type: string
        rating:
          type: number
          description: Average rating (1-5)
        totalEarnedXlm:
          type: number
        completedJobs:
          type: integer
        availability:
          type: string
          enum: ['available', 'busy', 'unavailable']
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Escrow:
      type: object
      properties:
        id:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        amountXlm:
          type: number
        status:
          type: string
          enum: ['funded', 'released', 'refunded', 'disputed', 'resolved']
        contractId:
          type: string
        createdAt:
          type: string
          format: date-time
        releasedAt:
          type: string
          format: date-time
          nullable: true
    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        senderAddress:
          type: string
        content:
          type: string
          description: Message content (encrypted)
        contractTxHash:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        read:
          type: boolean
    Rating:
      type: object
      properties:
        id:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        raterAddress:
          type: string
        ratedAddress:
          type: string
        stars:
          type: integer
          minimum: 1
          maximum: 5
        review:
          type: string
        createdAt:
          type: string
          format: date-time
    GasEstimate:
      type: object
      properties:
        slow:
          type: object
          properties:
            fee:
              type: string
            usd:
              type: string
              nullable: true
        medium:
          type: object
          properties:
            fee:
              type: string
            usd:
              type: string
              nullable: true
        fast:
          type: object
          properties:
            fee:
              type: string
            usd:
              type: string
              nullable: true
        recommended:
          type: string
          enum: ['slow', 'medium', 'fast']
        lastUpdated:
          type: string
          format: date-time
    DAOProposal:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        type:
          type: string
          enum: ['funding', 'parameter_change', 'arbitrator_election']
        proposer:
          type: string
        status:
          type: string
          enum: ['active', 'passed', 'rejected', 'executed', 'expired']
        votesFor:
          type: number
        votesAgainst:
          type: number
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    TokenInfo:
      type: object
      properties:
        contractId:
          type: string
        symbol:
          type: string
        name:
          type: string
        decimals:
          type: integer
        icon:
          type: string
          nullable: true
    Invoice:
      type: object
      properties:
        id:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        freelancerAddress:
          type: string
        totalHours:
          type: number
        hourlyRateXlm:
          type: number
        totalXlm:
          type: number
        status:
          type: string
          enum: ['pending', 'approved', 'rejected']
        createdAt:
          type: string
          format: date-time
paths:
  /api/webauthn/register-options:
    post:
      summary: Get WebAuthn registration options
      tags: ['WebAuthn']
      security:
        - bearerAuth: []
      responses:
        200:
          description: Registration options for creating a passkey
  /api/webauthn/register-verify:
    post:
      summary: Verify and store a WebAuthn credential
      tags: ['WebAuthn']
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ['credential']
              properties:
                credential:
                  type: object
                name:
                  type: string
      responses:
        200:
          description: Passkey registered
        400:
          description: Verification failed or no pending challenge
  /api/webauthn/login-options:
    post:
      summary: Get WebAuthn login options
      tags: ['WebAuthn']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ['publicKey']
              properties:
                publicKey:
                  type: string
      responses:
        200:
          description: Authentication options
  /api/webauthn/login-verify:
    post:
      summary: Verify WebAuthn authentication and issue JWT
      tags: ['WebAuthn']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ['credential', 'publicKey']
              properties:
                credential:
                  type: object
                publicKey:
                  type: string
      responses:
        200:
          description: JWT token issued
        401:
          description: Authentication failed
  /api/webauthn/credentials:
    get:
      summary: List registered passkeys
      tags: ['WebAuthn']
      security:
        - bearerAuth: []
      responses:
        200:
          description: Credential list
  /api/webauthn/credentials/{id}:
    delete:
      summary: Remove a passkey
      tags: ['WebAuthn']
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Passkey removed
  /api/webauthn/admin/credentials:
    get:
      summary: Admin list credentials for any user
      tags: ['WebAuthn']
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: publicKey
          schema:
            type: string
      responses:
        200:
          description: Credential list
  /api/webauthn/admin/credentials/{id}:
    delete:
      summary: Admin revoke a passkey
      tags: ['WebAuthn']
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Passkey revoked
  /api/verification/email:
    post:
      summary: Send email verification link
      tags: ['Verification']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ['email', 'publicKey']
              properties:
                email:
                  type: string
                  format: email
                publicKey:
                  type: string
      responses:
        200:
          description: Verification email sent
  /api/verification/email/confirm:
    post:
      summary: Confirm email verification with token
      tags: ['Verification']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ['token']
              properties:
                token:
                  type: string
      responses:
        200:
          description: Email verified
        400:
          description: Invalid or expired token
  /api/verification/phone:
    post:
      summary: Send phone verification OTP
      tags: ['Verification']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ['phone', 'publicKey']
              properties:
                phone:
                  type: string
                publicKey:
                  type: string
      responses:
        200:
          description: OTP sent
  /api/verification/phone/confirm:
    post:
      summary: Confirm phone verification with OTP
      tags: ['Verification']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ['otp', 'publicKey']
              properties:
                otp:
                  type: string
                publicKey:
                  type: string
      responses:
        200:
          description: Phone verified
        400:
          description: Invalid or expired OTP
  /api/verification/id/submit:
    post:
      summary: Submit ID verification for admin review
      tags: ['Verification']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ['publicKey', 'idType', 'idNumber', 'fullName']
              properties:
                publicKey:
                  type: string
                idType:
                  type: string
                idNumber:
                  type: string
                fullName:
                  type: string
      responses:
        200:
          description: ID submitted for review
  /api/verification/{publicKey}:
    get:
      summary: Get verification status for a user
      tags: ['Verification']
      parameters:
        - in: path
          name: publicKey
          required: true
          schema:
            type: string
      responses:
        200:
          description: Verification status
  /api/turrets/submit:
    post:
      summary: Submit transaction via Turret
      tags: ['Turrets']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ['transactionXDR']
              properties:
                transactionXDR:
                  type: string
                useTurret:
                  type: boolean
      responses:
        200:
          description: Transaction submitted
  /api/turrets/status:
    get:
      summary: Get Turret service status
      tags: ['Turrets']
      responses:
        200:
          description: Turret status
  /api/turrets/estimate:
    post:
      summary: Estimate transaction fees via Turret
      tags: ['Turrets']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ['transactionXDR']
              properties:
                transactionXDR:
                  type: string
      responses:
        200:
          description: Fee estimation
  /api/turrets/config:
    get:
      summary: Get Turret configuration
      tags: ['Turrets']
      responses:
        200:
          description: Turret config
  /api/transactions/export:
    get:
      summary: Export transaction history as CSV
      tags: ['Transactions']
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: format
          required: true
          schema:
            type: string
            enum: ['csv']
          description: Export format (only csv supported)
        - in: query
          name: account
          required: true
          schema:
            type: string
          description: Stellar public key
        - in: query
          name: filter
          schema:
            type: string
            enum: ['all', 'sent', 'received', 'escrow']
            default: all
      responses:
        200:
          description: CSV file download (streamed)
          content:
            text/csv:
              schema:
                type: string
        400:
          description: Invalid parameters
        403:
          description: Can only export own transactions
  /api/tokens:
    get:
      summary: List supported tokens (cached 1 hour)
      tags: ['Tokens']
      responses:
        200:
          description: Token list
  /api/tokens/popular:
    get:
      summary: Get popular tokens
      tags: ['Tokens']
      responses:
        200:
          description: Popular tokens list
  /api/tokens/search:
    get:
      summary: Search tokens by name or symbol
      tags: ['Tokens']
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
      responses:
        200:
          description: Search results
        400:
          description: Missing search query
  /api/tokens/{contractId}/metadata:
    get:
      summary: Get token metadata by contract ID
      tags: ['Tokens']
      parameters:
        - in: path
          name: contractId
          required: true
          schema:
            type: string
      responses:
        200:
          description: Token metadata
  /api/tokens/{contractId}/balance/{publicKey}:
    get:
      summary: Get token balance for an account
      tags: ['Tokens']
      parameters:
        - in: path
          name: contractId
          required: true
          schema:
            type: string
        - in: path
          name: publicKey
          required: true
          schema:
            type: string
      responses:
        200:
          description: Token balance
  /api/tokens/validate:
    post:
      summary: Validate if a contract is a token contract
      tags: ['Tokens']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ['contractId']
              properties:
                contractId:
                  type: string
      responses:
        200:
          description: Validation result
        400:
          description: Missing contract ID
  /api/time-entries:
    post:
      summary: Log a time entry for a job
      tags: ['Time Entries']
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ['jobId', 'durationMinutes']
              properties:
                jobId:
                  type: string
                  format: uuid
                durationMinutes:
                  type: integer
                description:
                  type: string
                startedAt:
                  type: string
                  format: date-time
      responses:
        201:
          description: Time entry created
  /api/time-entries/job/{jobId}:
    get:
      summary: Get time entries for a job
      tags: ['Time Entries']
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
      responses:
        200:
          description: Time entries list
  /api/time-entries/job/{jobId}/invoices:
    get:
      summary: Get invoices for a job
      tags: ['Time Entries']
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
      responses:
        200:
          description: Invoice list
  /api/time-entries/invoice:
    post:
      summary: Generate invoice from time entries
      tags: ['Time Entries']
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ['jobId', 'hourlyRateXlm']
              properties:
                jobId:
                  type: string
                hourlyRateXlm:
                  type: number
                entryIds:
                  type: array
                  items:
                    type: string
      responses:
        201:
          description: Invoice created
  /api/time-entries/invoice/{invoiceId}/review:
    patch:
      summary: Client approves or rejects an invoice
      tags: ['Time Entries']
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: invoiceId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ['decision']
              properties:
                decision:
                  type: string
                  enum: ['approved', 'rejected']
                contractTxHash:
                  type: string
      responses:
        200:
          description: Invoice reviewed
  /api/stats:
    get:
      summary: Get platform-wide metrics
      tags: ['Stats']
      responses:
        200:
          description: Platform metrics
  /api/stats/trends/jobs:
    get:
      summary: Get job posting trends
      tags: ['Stats']
      parameters:
        - in: query
          name: days
          schema:
            type: integer
            default: 90
            maximum: 365
      responses:
        200:
          description: Job trends
  /api/stats/trends/escrow:
    get:
      summary: Get escrow volume trends
      tags: ['Stats']
      parameters:
        - in: query
          name: days
          schema:
            type: integer
            default: 90
            maximum: 365
      responses:
        200:
          description: Escrow trends
  /api/stats/categories:
    get:
      summary: Get top job categories
      tags: ['Stats']
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
            maximum: 50
      responses:
        200:
          description: Top categories
  /api/stats/xlm-price-history:
    get:
      summary: Get 7-day XLM/USD price history
      tags: ['Stats']
      responses:
        200:
          description: Price history data
          headers:
            Cache-Control:
              schema:
                type: string
  /api/skills:
    get:
      summary: Search skills for autocomplete
      tags: ['Skills']
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
          description: Search query for skill name
      responses:
        200:
          description: Matching skills (up to 10)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /api/scope/{sessionId}/renew:
    post:
      summary: Extend a scope session by 24 hours
      tags: ['Scope']
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      responses:
        200:
          description: Session extended
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  sessionId:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
        404:
          description: Session not found or expired
  /api/saved-searches:
    get:
      summary: List saved searches
      tags: ['Saved Searches']
      security:
        - bearerAuth: []
      responses:
        200:
          description: Saved searches list
    post:
      summary: Save a new search (max 10)
      tags: ['Saved Searches']
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ['query_params']
              properties:
                query_params:
                  type: object
                notify_in_app:
                  type: boolean
                notify_email:
                  type: boolean
      responses:
        201:
          description: Search saved
        400:
          description: Limit reached or invalid params
  /api/saved-searches/{id}:
    patch:
      summary: Update saved search notification prefs
      tags: ['Saved Searches']
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Search updated
    delete:
      summary: Delete a saved search
      tags: ['Saved Searches']
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Search deleted
  /api/referrals/info:
    get:
      summary: Get referral bonus info (public)
      tags: ['Referrals']
      responses:
        200:
          description: Referral bonus percentage
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      bonusBps:
                        type: integer
                      bonusPercent:
                        type: string
                      description:
                        type: string
  /api/referrals/{publicKey}:
    get:
      summary: Get referral stats and history
      tags: ['Referrals']
      security:
