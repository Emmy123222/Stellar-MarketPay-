name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # or your project's version
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build the Next.js application
        run: npm run build

      - name: Start the application (production mode)
        run: |
          npm run start &
          npx wait-on http://localhost:3000
        env:
          # If your app needs environment variables, set them here.
          # For example:
          # NEXT_PUBLIC_API_URL: http://localhost:3000
          # DATABASE_URL: ... (but your mocks override all API calls)
          NODE_ENV: production

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright end‑to‑end tests (headless)
        run: npx playwright test frontend/e2e/post-job.spec.ts
        env:
          # Ensure Playwright uses the correct base URL (default is http://localhost:3000)
          # If your dev server runs on a different port, adjust here or in playwright.config.ts
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000
