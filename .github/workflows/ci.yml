name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Document workflow requirements
        run: |
          echo "## CI Workflow - Secrets Status"
          echo ""
          echo "✓ This workflow (CI) does **not** require secrets."
          echo ""
          echo "**For information about other workflows that do require secrets:**"
          echo "→ See [docs/ci-secrets.md](https://github.com/${{ github.repository }}/blob/main/docs/ci-secrets.md)"
          echo ""
          echo "**Workflows that require secrets:**"
          echo "- Deploy (staging): SSH_HOST, SSH_USER, SSH_KEY, APP_DIR"
          echo "- Deploy (production): SSH keys + AWS credentials + database credentials"
          echo "- Security scanning: No additional secrets required"

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
        continue-on-error: true

  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: secrets-scan
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: marketpay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/marketpay_test
      JWT_SECRET: ci-test-jwt-secret-with-sufficient-length
      CSRF_SECRET: ci-test-csrf-secret-with-sufficient-length
      DATABASE_ENCRYPTION_KEY: ci-test-encryption-key-32chars!!
      PORT: "0"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Reports but does not block: 65 pre-existing failures remain, mostly a
      # jest/axios ESM interop problem with @stellar/stellar-sdk and gaps in the
      # pool mock. Tracked in the open testing issues — remove
      # continue-on-error once the suite is green so it becomes a real gate.
      - name: Unit tests
        run: npx jest --selectProjects unit --forceExit
        continue-on-error: true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  backend-integration:
    name: Backend Integration
    runs-on: ubuntu-latest
    needs: secrets-scan
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: marketpay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # The app opens a Bull email queue and a cache client at boot; without a
      # reachable Redis, queue operations block indefinitely.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/marketpay_test
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/marketpay_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-jwt-secret-with-sufficient-length
      CSRF_SECRET: ci-test-csrf-secret-with-sufficient-length
      DATABASE_ENCRYPTION_KEY: ci-test-encryption-key-32chars!!
      # indexerService requires a contract id at boot; use the same mock id as
      # the frontend job since integration tests never touch the chain.
      CONTRACT_ID: CMOCKCONTRACTID
      PORT: "0"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Run migrations
        run: npm run migrate

      - name: Integration tests
        run: npm run test:integration

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: secrets-scan
    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_USE_CONTRACT_MOCK: "true"
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_STELLAR_NETWORK: testnet
      NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
      NEXT_PUBLIC_CONTRACT_ID: CMOCKCONTRACTID
      NODE_OPTIONS: "--max-old-space-size=4096"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit and accessibility tests
        run: npm test

      - name: Translation completeness
        run: npm run i18n:check

      - name: Build
        run: npm run build

  e2e-wallet:
    name: Frontend E2E — Wallet Connection
    runs-on: ubuntu-latest
    needs: secrets-scan
    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_USE_CONTRACT_MOCK: "true"
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_STELLAR_NETWORK: testnet
      NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
      NEXT_PUBLIC_CONTRACT_ID: CMOCKCONTRACTID

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Scoped to the wallet-connection flow (issue: e2e coverage for Freighter
      # connect / unavailable / disconnect). The older suites are not gated yet.
      - name: Run wallet connection e2e tests
        run: npx playwright test wallet-connection --project=chromium

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  contracts:
    name: Soroban Contracts — marketpay-contract
    runs-on: ubuntu-latest
    needs: secrets-scan
    defaults:
      run:
        working-directory: contracts/marketpay-contract

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: clippy, rustfmt

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/marketpay-contract/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      - name: Release WASM build
        run: cargo build --target wasm32v1-none --release

  arbitrator-registry:
    name: Soroban Contracts — arbitrator-registry
    runs-on: ubuntu-latest
    needs: secrets-scan
    defaults:
      run:
        working-directory: contracts/arbitrator-registry

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: clippy, rustfmt

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/arbitrator-registry/target
          key: ${{ runner.os }}-cargo-arbitrator-${{ hashFiles('contracts/arbitrator-registry/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-arbitrator-

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      - name: Release WASM build
        run: cargo build --target wasm32v1-none --release
