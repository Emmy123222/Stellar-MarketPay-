name: Validate Secrets

# This is a reusable workflow that validates required secrets before deployment.
# 
# Usage in another workflow:
#   jobs:
#     validate-secrets:
#       uses: ./.github/workflows/validate-secrets.yml
#       with:
#         required-secrets: "SSH_HOST,SSH_USER,SSH_KEY,APP_DIR"
#         context: "Deploy to staging"

on:
  workflow_call:
    inputs:
      required-secrets:
        description: "Comma-separated list of required secret names (e.g., SSH_HOST,SSH_USER,AWS_ACCESS_KEY_ID)"
        required: true
        type: string
      context:
        description: "Human-readable context for error messages (e.g., 'Deploy to staging')"
        required: false
        type: string
        default: "Workflow execution"

jobs:
  validate-secrets:
    name: Validate Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Parse required secrets
        id: parse
        run: |
          SECRETS="${{ inputs.required-secrets }}"
          IFS=',' read -ra SECRET_ARRAY <<< "$SECRETS"
          echo "secrets=${SECRET_ARRAY[@]}" >> $GITHUB_OUTPUT
          echo "count=${#SECRET_ARRAY[@]}" >> $GITHUB_OUTPUT

      - name: Check secrets presence
        run: |
          CONTEXT="${{ inputs.context }}"
          SECRETS="${{ inputs.required-secrets }}"
          IFS=',' read -ra SECRET_ARRAY <<< "$SECRETS"
          
          MISSING=()
          for SECRET in "${SECRET_ARRAY[@]}"; do
            SECRET_TRIMMED=$(echo "$SECRET" | xargs)
            SECRET_VAR="secrets.$SECRET_TRIMMED"
            # Use GitHub's secret reference syntax
            SECRET_VALUE=$(eval "echo \$${{ env[SECRET_TRIMMED] }}")
            if [ -z "${!SECRET_TRIMMED:-}" ]; then
              MISSING+=("$SECRET_TRIMMED")
            fi
          done
          
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "❌ ERROR: Missing required secrets for $CONTEXT"
            echo ""
            echo "The following secrets are not configured:"
            for SECRET in "${MISSING[@]}"; do
              echo "  • $SECRET"
            done
            echo ""
            echo "Documentation: See docs/ci-secrets.md for setup instructions"
            echo ""
            exit 1
          fi
          
          echo "✓ All required secrets are configured for $CONTEXT"
          echo ""
          echo "Configured secrets:"
          for SECRET in "${SECRET_ARRAY[@]}"; do
            SECRET_TRIMMED=$(echo "$SECRET" | xargs)
            echo "  ✓ $SECRET_TRIMMED"
          done

      - name: Summary
        if: success()
        run: |
          echo "## ✅ Secret Validation Passed"
          echo ""
          echo "Context: ${{ inputs.context }}"
          echo "Secrets checked: ${{ inputs.required-secrets }}"
