name: Accessibility Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contrast-audit:
    name: Color Contrast Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --legacy-peer-deps

      - name: Run contrast audit
        run: npm run audit:contrast

  unit-tests:
    name: Jest Accessibility Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --legacy-peer-deps

      - name: Run Jest accessibility tests
        run: npm test -- __tests__/accessibility.test.tsx

  axe-accessibility:
    name: axe-core E2E Accessibility Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run accessibility tests (Light mode)
        run: npx playwright test tests/e2e/accessibility.spec.ts --project=chromium
        env:
          NEXT_PUBLIC_USE_CONTRACT_MOCK: "true"
          NEXT_PUBLIC_API_URL: "http://localhost:4000"
          NEXT_PUBLIC_STELLAR_NETWORK: "testnet"
          NEXT_PUBLIC_HORIZON_URL: "https://horizon-testnet.stellar.org"
          NEXT_PUBLIC_CONTRACT_ID: "CMOCKCONTRACTID"

      - name: Run accessibility tests (Dark mode)
        run: npx playwright test tests/e2e/accessibility.spec.ts --project=chromium-dark
        env:
          NEXT_PUBLIC_USE_CONTRACT_MOCK: "true"
          NEXT_PUBLIC_API_URL: "http://localhost:4000"
          NEXT_PUBLIC_STELLAR_NETWORK: "testnet"
          NEXT_PUBLIC_HORIZON_URL: "https://horizon-testnet.stellar.org"
          NEXT_PUBLIC_CONTRACT_ID: "CMOCKCONTRACTID"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'frontend/playwright-report/index.html';
            
            let comment = '## 🎨 Accessibility Audit Results\n\n';
            comment += '✅ Color contrast audit passed\n';
            comment += '✅ Jest accessibility tests passed\n';
            comment += '✅ axe-core E2E tests passed\n\n';
            comment += 'All WCAG 2.1 Level AA requirements met across light, dark, and high contrast themes.';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
