name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, production]
        default: staging
      image_tag:
        description: Image tag to deploy (defaults to the current commit)
        required: false
        type: string
  schedule:
    - cron: "0 3 * * *"   # nightly database backup

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and Push Images
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The default docker driver cannot export a GHA cache; buildx can.
      - uses: docker/setup-buildx-action@v3

      - name: Resolve image tag and repository
        id: meta
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="$(git rev-parse --short HEAD)"; fi
          # GHCR needs a lowercase path, and a Docker reference component may
          # not end in a separator — this repo is named "Stellar-MarketPay-".
          REPO=$(echo "${{ github.repository }}" \
                 | tr '[:upper:]' '[:lower:]' \
                 | sed 's|[^a-z0-9._/-]||g; s|-*/|/|g; s|-*$||')
          echo "tag=$TAG"   >> "$GITHUB_OUTPUT"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "Image: ghcr.io/$REPO/{frontend,backend}:$TAG"

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}/frontend:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}/backend:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (${{ github.event.inputs.environment || 'staging' }})
    if: github.event_name != 'schedule'
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - name: Blue-green deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            set -euo pipefail
            cd "${{ secrets.APP_DIR }}"

            export IMAGE_TAG BACKEND_IMAGE_TAG="$IMAGE_TAG"
            MAX_RETRIES=30
            RETRY_INTERVAL=5
            HEALTH_ENDPOINT=/api/health
            BACKEND_PORT=4000

            mkdir -p nginx
            ACTIVE=$(grep -q "server backend-green:4000" nginx/nginx.conf 2>/dev/null && echo green || echo blue)
            TARGET=$([ "$ACTIVE" = green ] && echo blue || echo green)
            echo "Active: $ACTIVE -> Target: $TARGET"

            cp nginx/nginx.conf nginx/nginx.conf.bak 2>/dev/null || true

            docker compose -f docker-compose.prod.yml --profile "$TARGET" pull
            docker compose -f docker-compose.prod.yml --profile "$TARGET" up -d

            # Gate the traffic switch on the standby stack reporting healthy.
            for i in $(seq 1 $MAX_RETRIES); do
              if docker exec "backend-${TARGET}" \
                   wget -q -O- "http://localhost:${BACKEND_PORT}${HEALTH_ENDPOINT}" >/dev/null 2>&1; then
                echo "backend-${TARGET} healthy (attempt ${i})"
                break
              fi
              if [ "$i" -eq "$MAX_RETRIES" ]; then
                echo "Health check failed; rolling back."
                docker compose -f docker-compose.prod.yml --profile "$TARGET" rm -sf \
                  "frontend-${TARGET}" "backend-${TARGET}"
                [ -f nginx/nginx.conf.bak ] && mv nginx/nginx.conf.bak nginx/nginx.conf
                docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload || true
                exit 1
              fi
              sleep "$RETRY_INTERVAL"
            done

            cat > nginx/nginx.conf <<NGINX
            worker_processes auto;
            events { worker_connections 1024; }
            http {
              upstream backend_upstream  { server backend-${TARGET}:4000; }
              upstream frontend_upstream { server frontend-${TARGET}:3000; }
              server {
                listen 80;
                server_name _;
                location /api/ {
                  proxy_pass http://backend_upstream;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                }
                location / {
                  proxy_pass http://frontend_upstream;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                }
              }
            }
            NGINX

            docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload || true
            echo "Traffic switched to ${TARGET}. Retiring ${ACTIVE} in 600s."
            nohup bash -c "sleep 600 && docker compose -f docker-compose.prod.yml --profile ${ACTIVE} rm -sf frontend-${ACTIVE} backend-${ACTIVE}" >/dev/null 2>&1 &

  db-backup:
    name: Nightly Database Backup
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
      AWS_REGION: ${{ secrets.AWS_REGION || 'auto' }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_PREFIX: db-backups
      PGHOST: ${{ secrets.PGHOST }}
      PGPORT: ${{ secrets.PGPORT || '5432' }}
      PGDATABASE: ${{ secrets.PGDATABASE }}
      PGUSER: ${{ secrets.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      BACKUP_RETENTION_DAYS: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install pg_dump and AWS CLI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update

      - name: Run backup
        run: |
          chmod +x scripts/backup-db.sh
          ./scripts/backup-db.sh
