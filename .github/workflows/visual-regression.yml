name: Visual Regression

# Nightly pixel comparison of light/dark snapshots, including the money-critical
# surfaces (escrow funding, fee estimation, withdraw-to-bank, transactions).
# A diff fails the job. Baselines are Linux renders committed under
# frontend/tests/e2e/snapshots/ — see TESTING.md "Visual regression baselines".

on:
  schedule:
    - cron: "30 3 * * *" # nightly, 03:30 UTC
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Re-render baselines instead of comparing (download the artifact and commit it)"
        type: boolean
        default: false

concurrency:
  group: visual-regression-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual:
    name: Visual regression (light + dark)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_USE_CONTRACT_MOCK: "true"
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_STELLAR_NETWORK: testnet
      NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
      NEXT_PUBLIC_CONTRACT_ID: CMOCKCONTRACTID

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Compare against committed baselines (diffs fail the job)
        if: ${{ !inputs.update_snapshots }}
        run: npx playwright test tests/e2e/visual-regression.spec.ts --project=chromium --project=chromium-dark

      - name: Re-render baselines
        if: ${{ inputs.update_snapshots }}
        run: npx playwright test tests/e2e/visual-regression.spec.ts --project=chromium --project=chromium-dark --update-snapshots

      - name: Upload re-rendered baselines
        if: ${{ inputs.update_snapshots }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: frontend/tests/e2e/snapshots/visual-regression.spec.ts-snapshots/
          retention-days: 14

      - name: Upload diff report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 30
