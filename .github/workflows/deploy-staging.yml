name: Deploy Staging (Blue-Green)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA
        id: sha
        run: echo "SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:${{ steps.sha.outputs.SHA }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ steps.sha.outputs.SHA }}

      - name: Output image tag
        run: echo "IMAGE_TAG=${{ steps.sha.outputs.SHA }}" >> "$GITHUB_OUTPUT"

  deploy-staging:
    name: Deploy to Staging (Blue-Green)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH (blue-green)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.STAGING_APP_DIR }}"
            cd "$APP_DIR"

            export IMAGE_TAG="${{ needs.build-and-push.outputs.IMAGE_TAG }}"
            export BACKEND_IMAGE_TAG="${{ needs.build-and-push.outputs.IMAGE_TAG }}"
            export MAX_RETRIES="${MAX_RETRIES:-30}"
            export RETRY_INTERVAL="${RETRY_INTERVAL:-5}"
            export ROLLBACK_WINDOW="${ROLLBACK_WINDOW:-600}"
            export HEALTH_ENDPOINT="${HEALTH_ENDPOINT:-/api/health}"
            export BACKEND_PORT="${BACKEND_PORT:-4000}"

            echo "=== Blue-Green Staging Deployment ==="
            echo "Image tag: ${IMAGE_TAG}"

            mkdir -p nginx

            ACTIVE_ENV=$(grep -q "server backend-green:4000" nginx/nginx.conf 2>/dev/null && echo "green" || echo "blue")
            if [ "$ACTIVE_ENV" = "green" ]; then
              TARGET_ENV="blue"
            else
              TARGET_ENV="green"
            fi

            echo "Active environment: $ACTIVE_ENV"
            echo "Target environment: $TARGET_ENV"

            cp nginx/nginx.conf nginx/nginx.conf.bak

            echo "--- Pulling latest images for ${TARGET_ENV} ---"
            docker compose -f docker-compose.prod.yml --profile "${TARGET_ENV}" pull

            echo "--- Starting standby environment (${TARGET_ENV}) ---"
            docker compose -f docker-compose.prod.yml --profile "${TARGET_ENV}" up -d

            echo "--- Health-checking standby environment (${TARGET_ENV}) ---"
            RETRIES=0
            while [ $RETRIES -lt $MAX_RETRIES ]; do
              RETRIES=$((RETRIES + 1))
              STATUS=$(docker inspect --format='{{json .State.Health.Status}}' "backend-${TARGET_ENV}" 2>/dev/null || echo '"unknown"')

              if [ "$STATUS" = '"healthy"' ]; then
                HTTP_CODE=$(docker exec "backend-${TARGET_ENV}" wget -qO- "http://localhost:${BACKEND_PORT}${HEALTH_ENDPOINT}" --spider 2>/dev/null && echo "200" || echo "000")
                if [ "$HTTP_CODE" = "200" ]; then
                  echo "backend-${TARGET_ENV} is healthy (attempt ${RETRIES}/${MAX_RETRIES})."
                  break
                fi
                echo "Container healthy but endpoint returned ${HTTP_CODE}. Retrying..."
              else
                echo "Health status: ${STATUS}. Retrying in ${RETRY_INTERVAL}s... (${RETRIES}/${MAX_RETRIES})"
              fi

              if [ $RETRIES -ge $MAX_RETRIES ]; then
                echo "ERROR: Health check failed after ${MAX_RETRIES} attempts. Initiating rollback."
                docker compose -f docker-compose.prod.yml --profile "${TARGET_ENV}" rm -s -f "frontend-${TARGET_ENV}" "backend-${TARGET_ENV}"
                mv nginx/nginx.conf.bak nginx/nginx.conf
                docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload 2>/dev/null || true
                echo "Rollback complete. Traffic remains on ${ACTIVE_ENV}."
                exit 1
              fi
              sleep "$RETRY_INTERVAL"
            done

            echo "--- Switching NGINX upstream to ${TARGET_ENV} ---"
            cat > nginx/nginx.conf.tmp <<EOF
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream backend_upstream {
        server backend-${TARGET_ENV}:4000;
    }
    upstream frontend_upstream {
        server frontend-${TARGET_ENV}:3000;
    }

    server {
        listen 80;
        server_name _;

        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_set_header Host \$host;
            proxy_set_header X-Real-IP \$remote_addr;
            proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host \$host;
            proxy_set_header X-Real-IP \$remote_addr;
            proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
        }
    }
}
EOF
            mv nginx/nginx.conf.tmp nginx/nginx.conf

            echo "Reloading NGINX..."
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload 2>/dev/null || true

            echo "--- Verifying traffic switch ---"
            sleep 2
            VERIFY_CODE=$(wget -qO- "http://localhost/api/health" --spider 2>/dev/null && echo "200" || echo "000")
            if [ "$VERIFY_CODE" != "200" ]; then
              echo "WARNING: Post-switch verification failed (status: ${VERIFY_CODE}). Initiating rollback."
              docker compose -f docker-compose.prod.yml --profile "${TARGET_ENV}" rm -s -f "frontend-${TARGET_ENV}" "backend-${TARGET_ENV}"
              mv nginx/nginx.conf.bak nginx/nginx.conf
              docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload 2>/dev/null || true
              echo "Rollback complete. Traffic restored to ${ACTIVE_ENV}."
              exit 1
            fi

            echo "--- Scheduling teardown of old environment (${ACTIVE_ENV}) in 600s ---"
            nohup bash -c "sleep 600 && docker compose -f docker-compose.prod.yml --profile ${ACTIVE_ENV} rm -s -f frontend-${ACTIVE_ENV} backend-${ACTIVE_ENV}" > /dev/null 2>&1 &

            echo ""
            echo "=== Staging deployment to ${TARGET_ENV} successful ==="
            echo "Active environment is now: ${TARGET_ENV}"
            echo "Old environment (${ACTIVE_ENV}) will be torn down in 600s."

      - name: Notify Discord on success
        if: success()
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "Staging Deployment Successful",
                "description": "Blue-green deployment completed successfully.\nImage tag: ${{ needs.build-and-push.outputs.IMAGE_TAG }}",
                "color": 3066993
              }]
            }'

      - name: Notify Discord on failure
        if: failure()
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "Staging Deployment Failed",
                "description": "Blue-green deployment failed. Automated rollback executed.\nImage tag: ${{ needs.build-and-push.outputs.IMAGE_TAG }}",
                "color": 15158332
              }]
            }'
